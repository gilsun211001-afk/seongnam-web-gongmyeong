<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>소상공인 홍보글 초안 도우미</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#29251f;background:#fffaf2}body{margin:0}.wrap{max-width:820px;margin:auto;padding:32px 20px 64px}h1{margin-bottom:8px}.lead{color:#655f56;margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:grid;gap:6px;font-weight:700}input,textarea,select,button{font:inherit;border-radius:12px;border:1px solid #d8d0c4;padding:12px}textarea{min-height:82px;resize:vertical}button{background:#f09b59;color:#24190f;border:0;font-weight:800;cursor:pointer}.results{display:grid;gap:16px;margin-top:24px}.card{background:white;border:1px solid #eadfd1;border-radius:16px;padding:18px}.card h2{font-size:18px;margin-top:0}.output{white-space:pre-wrap;line-height:1.7}.actions{display:flex;justify-content:flex-end;margin-top:10px}.copy{background:#514a42;color:white;padding:8px 12px}.notice{font-size:14px;color:#6f685e}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>소상공인 홍보글 초안 도우미</h1>
    <p class="lead">업종과 서비스 정보를 넣으면 블로그와 인스타그램에 맞는 초안을 만듭니다.</p>
    <form id="generator" class="grid">
      <label>업종<input name="business" placeholder="예: 분당 네일숍" required maxlength="40"></label>
      <label>상품 또는 서비스<input name="offer" placeholder="예: 가을 웨딩 네일" required maxlength="60"></label>
      <label class="full">고객에게 알려야 할 특징<textarea name="features" placeholder="예: 예약제, 색상 상담 가능, 판교역에서 도보 5분" required maxlength="240"></textarea></label>
      <label>말투<select name="tone"><option value="friendly">친근하게</option><option value="calm">차분하게</option><option value="clear">간결하게</option></select></label>
      <label>행동 유도<input name="cta" placeholder="예: 네이버 예약에서 확인해 주세요" maxlength="80"></label>
      <button class="full" type="submit">초안 만들기</button>
    </form>
    <p class="notice">입력 내용은 브라우저 안에서만 처리되며 저장하거나 전송하지 않습니다. 생성 후 사실과 조건을 직접 확인하세요.</p>
    <section id="results" class="results" hidden aria-live="polite"></section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
