<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>소상공인 AI 업무진단 준비</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#25211d;background:#f8f6f1}body{margin:0}.wrap{max-width:820px;margin:auto;padding:32px 20px 64px}h1{margin-bottom:8px}.lead,.notice{color:#696158}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:grid;gap:6px;font-weight:700}input,textarea,select,button,a.action{font:inherit;border-radius:12px;border:1px solid #d7d0c5;padding:12px}textarea{min-height:86px;resize:vertical}button,a.action{border:0;background:#337562;color:white;font-weight:800;text-decoration:none;text-align:center;cursor:pointer}.result{margin-top:24px;background:white;border:1px solid #e2ddd4;border-radius:16px;padding:20px}.summary{white-space:pre-wrap;line-height:1.7}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.secondary{background:#4e4943!important}.notice{font-size:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.actions>*{width:100%;box-sizing:border-box}}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>소상공인 AI 업무진단 준비</h1>
    <p class="lead">반복되는 일을 정리하면 상담 전에 확인할 문제와 자동화 후보를 보여드립니다.</p>
    <form id="diagnostic" class="grid">
      <label>업종<input name="business" placeholder="예: 카페, 네일숍, 학원" required maxlength="40"></label>
      <label>가장 자주 반복되는 일<select name="area" required><option value="">선택해 주세요</option><option>홍보글 작성</option><option>문의와 상담 정리</option><option>예약 관리</option><option>견적 작성</option><option>리뷰 답변</option><option>고객 관리</option><option>반복 문서 작성</option><option>기타</option></select></label>
      <label class="full">현재 어떻게 처리하고 있나요?<textarea name="current" placeholder="예: 카카오톡 문의를 보고 수기로 엑셀에 옮깁니다" required maxlength="300"></textarea></label>
      <label>일주일에 걸리는 시간<input name="hours" type="number" min="0" max="168" step="0.5" placeholder="예: 3"></label>
      <label>가장 불편한 점<input name="pain" placeholder="예: 문의를 놓치는 경우가 있습니다" required maxlength="120"></label>
      <label class="full">원하는 결과<textarea name="outcome" placeholder="예: 문의가 오면 필요한 항목이 자동으로 정리되면 좋겠습니다" required maxlength="240"></textarea></label>
      <button class="full" type="submit">진단 요약 만들기</button>
    </form>
    <p class="notice">입력 내용은 이 브라우저에서만 처리됩니다. 민감한 고객정보, 전화번호, 계정정보는 입력하지 마세요.</p>
    <section id="result" class="result" hidden aria-live="polite">
      <h2>상담 준비 요약</h2>
      <div id="summary" class="summary"></div>
      <div class="actions">
        <button id="copy" type="button">요약 복사</button>
        <a class="action secondary" href="https://www.instagram.com/seongnam_web1/" target="_blank" rel="noopener noreferrer">인스타그램에서 문의</a>
      </div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
